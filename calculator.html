<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    <style>
        body {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            font-family: 'Inter', sans-serif;
        }
        .calculator {
            max-width: 600px;
            padding: 28px;
            border-radius: 20px;
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.35);
        }
        .display {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.8);
            color: #F8FAFC;
        }
        .button {
            width: 60px;
            height: 60px;
            margin: 5px;
            border: none;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.8);
            color: #F8FAFC;
            font-size: 24px;
            cursor: pointer;
        }
        .button:hover {
            background: rgba(56, 189, 248, 0.2);
        }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" class="display" disabled>
        <div class="row">
            <button class="button" onclick="clearDisplay()">C</button>
            <button class="button" onclick="backspace()">DEL</button>
            <button class="button" onclick="calculate('%')">%</button>
            <button class="button" onclick="calculate('/')">/</button>
        </div>
        <div class="row">
            <button class="button" onclick="calculate('7')">7</button>
            <button class="button" onclick="calculate('8')">8</button>
            <button class="button" onclick="calculate('9')">9</button>
            <button class="button" onclick="calculate('*')">*</button>
        </div>
        <div class="row">
            <button class="button" onclick="calculate('4')">4</button>
            <button class="button" onclick="calculate('5')">5</button>
            <button class="button" onclick="calculate('6')">6</button>
            <button class="button" onclick="calculate('-')">-</button>
        </div>
        <div class="row">
            <button class="button" onclick="calculate('1')">1</button>
            <button class="button" onclick="calculate('2')">2</button>
            <button class="button" onclick="calculate('3')">3</button>
            <button class="button" onclick="calculate('+')">+</button>
        </div>
        <div class="row">
            <button class="button" onclick="calculate('0')">0</button>
            <button class="button" onclick="calculate('.')">.</button>
            <button class="button" onclick="calculate('=')">=</button>
        </div>
    </div>
    <script>
        let display = document.getElementById('display');
        let currentNumber = '';
        let previousNumber = '';
        let operator = '';
        function calculate(value) {
            if (value === '=') {
                if (currentNumber !== '' && previousNumber !== '') {
                    let result = eval(previousNumber + operator + currentNumber);
                    display.value = result;
                    currentNumber = '';
                    previousNumber = '';
                    operator = '';
                }
            } else if (value === 'C') {
                display.value = '';
                currentNumber = '';
                previousNumber = '';
                operator = '';
            } else if (value === 'DEL') {
                if (currentNumber !== '') {
                    currentNumber = currentNumber.slice(0, -1);
                    display.value = currentNumber;
                } else if (previousNumber !== '') {
                    previousNumber = previousNumber.slice(0, -1);
                    display.value = previousNumber;
                }
            } else if (['+', '-', '*', '/'].includes(value)) {
                if (currentNumber !== '') {
                    previousNumber = currentNumber;
                    operator = value;
                    currentNumber = '';
                }
            } else {
                currentNumber += value;
                display.value = currentNumber;
            }
        }
        function clearDisplay() {
            display.value = '';
            currentNumber = '';
            previousNumber = '';
            operator = '';
        }
        function backspace() {
            if (currentNumber !== '') {
                currentNumber = currentNumber.slice(0, -1);
                display.value = currentNumber;
            } else if (previousNumber !== '') {
                previousNumber = previousNumber.slice(0, -1);
                display.value = previousNumber;
            }
        }
    </script>
</body>
</html>
