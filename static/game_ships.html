<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starfleet Battles - Nexus Core AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        body { background:#030712; color:#f8fafc; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:15px; overflow:hidden; }
        .game-wrapper { background:rgba(15,23,42,0.85); backdrop-filter:blur(25px); border:1px solid rgba(56,189,248,0.3); border-radius:24px; padding:24px; box-shadow:0 0 50px rgba(56,189,248,0.25); text-align:center; max-width:640px; width:100%; position:relative; }
        .game-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; font-family:'JetBrains Mono', monospace; font-size:0.95rem; }
        h1 { font-size:1.6rem; background:linear-gradient(135deg,#38bdf8,#818cf8,#ec4899); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:8px; font-weight:800; }
        .hud-pill { background:rgba(255,255,255,0.06); padding:6px 14px; border-radius:20px; border:1px solid rgba(255,255,255,0.1); }
        .health-bar { width:120px; height:12px; background:rgba(255,255,255,0.1); border-radius:6px; overflow:hidden; display:inline-block; vertical-align:middle; margin-left:6px; }
        .health-fill { height:100%; width:100%; background:linear-gradient(90deg,#10b981,#38bdf8); transition:width 0.2s; }
        canvas { background:#050816; border:2px solid rgba(56,189,248,0.2); border-radius:16px; display:block; margin:0 auto; box-shadow:inset 0 0 40px rgba(0,0,0,0.9); }
        .controls-bar { margin-top:14px; color:#94a3b8; font-size:0.85rem; display:flex; justify-content:space-between; align-items:center; }
        .btn-restart { padding:8px 18px; border-radius:10px; background:linear-gradient(135deg,#6366f1,#38bdf8); color:white; border:none; font-weight:600; cursor:pointer; font-size:0.85rem; box-shadow:0 0 15px rgba(99,102,241,0.4); }
        .btn-restart:hover { transform:scale(1.04); }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <h1>?? Galactic Starfleet War</h1>
        <div class="game-header">
            <div class="hud-pill">Score: <b id="score-val" style="color:#38bdf8;">0</b></div>
            <div class="hud-pill">
                Shields:
                <div class="health-bar"><div class="health-fill" id="shield-fill"></div></div>
            </div>
            <div class="hud-pill">Wave: <b id="wave-val" style="color:#ec4899;">1</b></div>
        </div>
        
        <canvas id="battleCanvas" width="580" height="420"></canvas>
        
        <div class="controls-bar">
            <span>?? <b>WASD / Arrow Keys</b> to steer ship | <b>SPACEBAR</b> to fire plasma lasers</span>
            <button class="btn-restart" onclick="restartGame()">Deploy New Fleet</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('battleCanvas');
        const ctx = canvas.getContext('2d');
        let animationId;
        let score = 0, shields = 100, wave = 1, gameOver = false;

        // Player Battle Cruiser
        const player = { x: canvas.width/2, y: canvas.height - 50, w: 32, h: 36, speed: 6, dx: 0, dy: 0 };
        const lasers = [];
        const enemyLasers = [];
        const enemies = [];
        const particles = [];
        const stars = [];

        for(let i=0; i<60; i++) {
            stars.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: Math.random()*2, speed: 0.5 + Math.random()*1.5 });
        }

        const keys = {};
        window.addEventListener('keydown', e => { keys[e.code] = true; if(e.code==='Space') shootLaser(); });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        function shootLaser() {
            if(gameOver) return;
            lasers.push({ x: player.x - 10, y: player.y - 12, speed: 10, color: '#38bdf8' });
            lasers.push({ x: player.x + 10, y: player.y - 12, speed: 10, color: '#38bdf8' });
        }

        function spawnWave() {
            enemies.length = 0;
            const count = 4 + wave * 2;
            for(let i=0; i<count; i++) {
                enemies.push({
                    x: 40 + (i % 6) * 85,
                    y: 40 + Math.floor(i / 6) * 60,
                    w: 28, h: 28,
                    speedX: (Math.random() > 0.5 ? 1 : -1) * (1.2 + wave * 0.2),
                    shootCooldown: Math.floor(Math.random() * 90) + 40,
                    color: i % 2 === 0 ? '#ec4899' : '#f59e0b'
                });
            }
        }

        function createExplosion(x, y, color) {
            for(let i=0; i<16; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 25,
                    color: color || '#f59e0b'
                });
            }
        }

        function update() {
            if(gameOver) return;

            // Player movement
            if(keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
            if(keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
            if(keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
            if(keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;

            player.x = Math.max(20, Math.min(canvas.width - 20, player.x));
            player.y = Math.max(100, Math.min(canvas.height - 30, player.y));

            // Stars parallax
            stars.forEach(s => { s.y += s.speed; if(s.y > canvas.height) s.y = 0; });

            // Player Lasers
            for(let i = lasers.length - 1; i >= 0; i--) {
                lasers[i].y -= lasers[i].speed;
                if(lasers[i].y < 0) { lasers.splice(i, 1); continue; }

                // Check collision with enemies
                for(let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    if(lasers[i] && Math.hypot(lasers[i].x - e.x, lasers[i].y - e.y) < 22) {
                        createExplosion(e.x, e.y, e.color);
                        enemies.splice(j, 1);
                        lasers.splice(i, 1);
                        score += 50;
                        document.getElementById('score-val').innerText = score;
                        break;
                    }
                }
            }

            // Enemy movement & shooting
            enemies.forEach(e => {
                e.x += e.speedX;
                if(e.x < 25 || e.x > canvas.width - 25) e.speedX *= -1;
                if(--e.shootCooldown <= 0) {
                    enemyLasers.push({ x: e.x, y: e.y + 14, speed: 4.5, color: '#ec4899' });
                    e.shootCooldown = Math.floor(Math.random() * 110) + 60;
                }
            });

            // Enemy Lasers
            for(let i = enemyLasers.length - 1; i >= 0; i--) {
                const el = enemyLasers[i];
                el.y += el.speed;
                if(el.y > canvas.height) { enemyLasers.splice(i, 1); continue; }

                // Hit player
                if(Math.hypot(el.x - player.x, el.y - player.y) < 20) {
                    createExplosion(player.x, player.y, '#38bdf8');
                    enemyLasers.splice(i, 1);
                    shields -= 20;
                    document.getElementById('shield-fill').style.width = Math.max(0, shields) + '%';
                    if(shields <= 0) {
                        gameOver = true;
                    }
                }
            }

            // Particles
            for(let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy;
                if(--p.life <= 0) particles.splice(i, 1);
            }

            // Next Wave
            if(enemies.length === 0) {
                wave++;
                document.getElementById('wave-val').innerText = wave;
                shields = Math.min(100, shields + 30);
                document.getElementById('shield-fill').style.width = shields + '%';
                spawnWave();
            }
        }

        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height);

            // Draw Stars
            ctx.fillStyle = '#ffffff';
            stars.forEach(s => { ctx.fillRect(s.x, s.y, s.size, s.size); });

            // Draw Player Ship (Neon Falcon)
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.fillStyle = '#38bdf8';
            ctx.shadowColor = '#38bdf8';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(0, -18);
            ctx.lineTo(16, 16);
            ctx.lineTo(0, 8);
            ctx.lineTo(-16, 16);
            ctx.closePath();
            ctx.fill();
            // Engine plume
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.moveTo(-6, 10);
            ctx.lineTo(6, 10);
            ctx.lineTo(0, 18 + Math.random()*8);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            // Draw Lasers
            lasers.forEach(l => {
                ctx.fillStyle = l.color;
                ctx.shadowColor = l.color;
                ctx.shadowBlur = 10;
                ctx.fillRect(l.x - 2, l.y, 4, 12);
            });

            // Draw Enemy Lasers
            enemyLasers.forEach(el => {
                ctx.fillStyle = el.color;
                ctx.shadowColor = el.color;
                ctx.shadowBlur = 8;
                ctx.fillRect(el.x - 2, el.y, 4, 10);
            });

            // Draw Enemies (Alien Dreadnoughts)
            enemies.forEach(e => {
                ctx.save();
                ctx.translate(e.x, e.y);
                ctx.fillStyle = e.color;
                ctx.shadowColor = e.color;
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.moveTo(0, 14);
                ctx.lineTo(14, -12);
                ctx.lineTo(-14, -12);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            });

            // Draw Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 6;
                ctx.fillRect(p.x, p.y, 3, 3);
            });

            // Game Over overlay
            if(gameOver) {
                ctx.fillStyle = 'rgba(3, 7, 18, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ef4444';
                ctx.font = 'bold 32px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('CRUISER DESTROYED', canvas.width/2, canvas.height/2 - 20);
                ctx.fillStyle = '#f8fafc';
                ctx.font = '16px Inter, sans-serif';
                ctx.fillText(`Final War Score: ${score} | Reached Wave: ${wave}`, canvas.width/2, canvas.height/2 + 20);
                ctx.fillStyle = '#38bdf8';
                ctx.fillText('Click "Deploy New Fleet" below to relaunch', canvas.width/2, canvas.height/2 + 55);
            }
        }

        function gameLoop() {
            update();
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }

        function restartGame() {
            score = 0; shields = 100; wave = 1; gameOver = false;
            document.getElementById('score-val').innerText = score;
            document.getElementById('shield-fill').style.width = '100%';
            document.getElementById('wave-val').innerText = wave;
            lasers.length = 0; enemyLasers.length = 0; particles.length = 0;
            player.x = canvas.width/2; player.y = canvas.height - 50;
            spawnWave();
        }

        spawnWave();
        gameLoop();
    </script>
</body>
</html>
